name: Publish pinned AI catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-catalog-publish
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install locked collector dependencies
        working-directory: landing
        run: npm ci --no-audit --no-fund

      - name: Collect pinned product manifests
        working-directory: landing
        env:
          CATALOG_GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${CATALOG_GITHUB_TOKEN:?CATALOG_GITHUB_TOKEN is required for private manifests}"
          npm run collect

      - name: Check public fields, secret patterns, and exact-byte receipts
        working-directory: landing
        run: node scripts/check-public-catalog.mjs

      - name: Publish only generated catalog files to an immutable commit
        id: publish
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/catalog-generated"
          mkdir -p "$stage/projects"
          cp landing/.generated/projects/*.md landing/.generated/projects/catalog-provenance.json "$stage/projects/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin catalog-generated >/dev/null; then
            git fetch origin catalog-generated
            git switch -C catalog-generated FETCH_HEAD
            git rm -r --ignore-unmatch projects >/dev/null
          else
            git switch --orphan catalog-generated
          fi
          mkdir -p projects
          cp "$stage/projects/"* projects/
          git add projects
          git ls-files | python3 -c 'import re,sys; paths=sys.stdin.read().splitlines(); assert paths and all(re.fullmatch(r"projects/(?:[a-z0-9-]+\.md|catalog-provenance\.json)", p) for p in paths), paths'
          # Preserve canonical Markdown bytes, including source whitespace.
          git commit -m "catalog: pinned collection from run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/catalog-generated
          echo "catalog_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record the pinned catalog commit
        env:
          CATALOG_COMMIT: ${{ steps.publish.outputs.catalog_commit }}
        run: echo "Catalog commit $CATALOG_COMMIT is ready for verified AI host import." >> "$GITHUB_STEP_SUMMARY"
